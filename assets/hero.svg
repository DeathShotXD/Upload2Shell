<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Upload2Shell</title>
  <desc id="desc">Zero-click print-to-shell: anonymous IPP job reaches Ghostscript and executes a command as the CUPS filter account.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090c"/>
      <stop offset="0.55" stop-color="#08131a"/>
      <stop offset="1" stop-color="#05090c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22a99a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c76a"/>
      <stop offset="1" stop-color="#e08a3c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#10242b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.45"/>
  <circle cx="1080" cy="30" r="230" fill="#5eead4" opacity="0.05"/>
  <circle cx="100" cy="410" r="250" fill="#f5c76a" opacity="0.05"/>

  <text x="64" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7f95a8" letter-spacing="3">N-DAY CHAIN · DEBIAN 13 · UBUNTU 22.04 / 24.04</text>

  <text x="62" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="64" font-weight="700" fill="#e9f2f5">Upload2Shell</text>
  <rect x="64" y="160" width="470" height="3" rx="1.5" fill="url(#teal)" opacity="0.9"/>
  <text x="66" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#e9f2f5">Zero-click print-to-shell.</text>
  <text x="66" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7f95a8">CVE-2026-125396 · Ghostscript Type 1 UAF · fixed in 10.08.0</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="66" y="262" width="176" height="34" rx="17" fill="#0f1a14" stroke="#f5c76a" stroke-opacity="0.65"/>
    <circle cx="86" cy="279" r="4" fill="#f5c76a"/>
    <text x="98" y="284" fill="#f7d89a">CVE-2026-125396</text>

    <rect x="254" y="262" width="142" height="34" rx="17" fill="#1c0f16" stroke="#fb7185" stroke-opacity="0.65"/>
    <circle cx="274" cy="279" r="4" fill="#fb7185"/>
    <text x="286" y="284" fill="#fda4af">CVSS 8.5</text>

    <rect x="408" y="262" width="150" height="34" rx="17" fill="#0f1a14" stroke="#5eead4" stroke-opacity="0.6"/>
    <circle cx="428" cy="279" r="4" fill="#5eead4"/>
    <text x="440" y="284" fill="#a7f3e4">ZERO CLICK</text>

    <rect x="66" y="308" width="150" height="34" rx="17" fill="#101c24" stroke="#1d2f39"/>
    <text x="84" y="330" fill="#b9cbd6">CUPS · IPP</text>

    <rect x="228" y="308" width="168" height="34" rx="17" fill="#101c24" stroke="#1d2f39"/>
    <text x="246" y="330" fill="#b9cbd6">GHOSTSCRIPT</text>

    <rect x="408" y="308" width="186" height="34" rx="17" fill="#101c24" stroke="#1d2f39"/>
    <text x="426" y="330" fill="#b9cbd6">uid=7(lp)</text>
  </g>

  <g transform="translate(716,56)">
    <rect x="0" y="0" width="424" height="306" rx="16" fill="#080f13" stroke="#1d2f39"/>
    <rect x="0" y="0" width="424" height="44" rx="16" fill="#0c1a20"/>
    <rect x="0" y="28" width="424" height="16" fill="#0c1a20"/>
    <circle cx="22" cy="22" r="5" fill="#fb7185"/>
    <circle cx="40" cy="22" r="5" fill="#f5c76a"/>
    <circle cx="58" cy="22" r="5" fill="#5eead4"/>
    <text x="86" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7f95a8">cups_poc.py</text>

    <text x="24" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7f95a8">POST /printers/u2s</text>
    <rect x="24" y="84" width="376" height="26" rx="4" fill="#0a1a1e" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="36" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#a7f3e4">Content-Type: application/ipp · anonymous</text>

    <text x="24" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f95a8">gstopdf → gstoraster → gs -dSAFER</text>
    <text x="24" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#f7d89a">Type 1 font UAF → path_control_active := 0</text>

    <rect x="24" y="178" width="376" height="44" rx="8" fill="#07171b" stroke="#5eead4" stroke-opacity="0.45"/>
    <text x="38" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a7f3e4">%pipe%id &gt; /tmp/pwned</text>
    <text x="38" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f95a8">as the filter account</text>

    <rect x="24" y="236" width="376" height="44" rx="8" fill="#0b1013" stroke="#1d2f39"/>
    <text x="38" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e9f2f5">uid=7(lp) gid=7(lp) groups=7(lp)</text>
    <text x="38" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#7f95a8">9/9 across three distros</text>
  </g>

  <path d="M 606 210 C 650 170, 678 168, 710 196" fill="none" stroke="url(#teal)" stroke-width="2.5" stroke-dasharray="6 6" filter="url(#glow)"/>
  <path d="M 700 190 L 712 197 L 699 204" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
