<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Upload2Shell lab verification matrix</title>
<desc id="desc">Nine successful jobs across Debian 13, Ubuntu 24.04 and Ubuntu 22.04, with fixed-build controls failing at the dangling lookup.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#08151e"/><stop offset="1" stop-color="#03090f"/></linearGradient>
 <linearGradient id="head" x2="1"><stop stop-color="#102c32"/><stop offset="1" stop-color="#151c20"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#19313a" opacity=".38"/></pattern>
</defs>
<rect width="1200" height="430" rx="16" fill="url(#bg)"/><rect width="1200" height="430" rx="16" fill="url(#grid)"/>
<path d="M0 0H1200V7H0Z" fill="#ff9226"/>
<g font-family="DejaVu Sans Mono,monospace">
 <text x="42" y="54" fill="#ffe7b4" font-size="26" font-weight="bold" letter-spacing="2">REPRODUCED ACROSS THREE DISTROS</text>
 <text x="44" y="80" fill="#7fa1a7" font-size="13" letter-spacing="1.5">SAME REQUEST / SAME PAYLOAD / DISTRIBUTION-SPECIFIC GHOSTSCRIPT</text>
 <g transform="translate(1000 27)">
  <rect width="155" height="56" rx="7" fill="#251506" stroke="#f49a2c" stroke-width="2"/>
  <text x="77" y="24" fill="#f9c46f" text-anchor="middle" font-size="11">SUCCESSFUL JOBS</text>
  <text x="77" y="46" fill="#fff0c9" text-anchor="middle" font-size="23" font-weight="bold">09 / 09</text>
 </g>
 <rect x="40" y="108" width="1120" height="42" rx="5" fill="url(#head)" stroke="#2b5558"/>
 <g fill="#8fe9dc" font-size="13" letter-spacing="1.5">
  <text x="65" y="135">ENVIRONMENT</text><text x="340" y="135">GHOSTSCRIPT BUILD</text><text x="680" y="135">DEVICE REFERENCE</text><text x="1000" y="135">OBSERVED RESULT</text>
 </g>
 <!-- rows -->
 <g>
  <rect x="40" y="160" width="1120" height="56" rx="5" fill="#0b1b20" stroke="#25434a"/>
  <rect x="40" y="160" width="6" height="56" fill="#8bdc91"/>
  <text x="65" y="195" fill="#fff0d1" font-size="16" font-weight="bold">Debian 13 (trixie)</text>
  <text x="340" y="195" fill="#d3d9d0" font-size="14">10.05.1~dfsg-1+deb13u1</text>
  <text x="680" y="195" fill="#82dfd1" font-size="14">pdevice -> psi_device_ref</text>
  <rect x="984" y="174" width="150" height="28" rx="4" fill="#0c2418" stroke="#66b878"/>
  <text x="1059" y="193" fill="#a6efae" font-size="13" text-anchor="middle" font-weight="bold">3/3 / uid=7(lp)</text>
 </g>
 <g>
  <rect x="40" y="226" width="1120" height="56" rx="5" fill="#0b1b20" stroke="#25434a"/>
  <rect x="40" y="226" width="6" height="56" fill="#8bdc91"/>
  <text x="65" y="261" fill="#fff0d1" font-size="16" font-weight="bold">Ubuntu 24.04 (noble)</text>
  <text x="340" y="261" fill="#d3d9d0" font-size="14">10.02.1~dfsg1-0ubuntu7.9</text>
  <text x="680" y="261" fill="#82dfd1" font-size="14">pdevice -> psi_device_ref</text>
  <rect x="984" y="240" width="150" height="28" rx="4" fill="#0c2418" stroke="#66b878"/>
  <text x="1059" y="259" fill="#a6efae" font-size="13" text-anchor="middle" font-weight="bold">3/3 / uid=7(lp)</text>
 </g>
 <g>
  <rect x="40" y="292" width="1120" height="56" rx="5" fill="#0b1b20" stroke="#25434a"/>
  <rect x="40" y="292" width="6" height="56" fill="#f4b34e"/>
  <text x="65" y="327" fill="#fff0d1" font-size="16" font-weight="bold">Ubuntu 22.04 (jammy)</text>
  <text x="340" y="327" fill="#d3d9d0" font-size="14">9.55.0~dfsg1-0ubuntu5.14</text>
  <text x="680" y="327" fill="#f4c878" font-size="14">pdevice is gx_device*</text>
  <rect x="984" y="306" width="150" height="28" rx="4" fill="#0c2418" stroke="#66b878"/>
  <text x="1059" y="325" fill="#a6efae" font-size="13" text-anchor="middle" font-weight="bold">3/3 / uid=7(lp)</text>
 </g>
 <g>
  <rect x="40" y="358" width="1120" height="48" rx="5" fill="#1a1016" stroke="#81424a" stroke-dasharray="6 5"/>
  <rect x="40" y="358" width="6" height="48" fill="#ed7881"/>
  <text x="65" y="388" fill="#f0c6c6" font-size="15" font-weight="bold">FIXED-BUILD CONTROL</text>
  <text x="340" y="388" fill="#cbb6b5" font-size="13">+deb13u2 / +deb13u3 / 7.10 / 5.15</text>
  <text x="680" y="388" fill="#f19aa1" font-size="13">dangling lookup fails</text>
  <text x="1059" y="388" fill="#f19aa1" font-size="13" text-anchor="middle">NO EXECUTION</text>
 </g>
</g>
<rect x="1" y="1" width="1198" height="428" rx="15" fill="none" stroke="#27424a"/>
</svg>