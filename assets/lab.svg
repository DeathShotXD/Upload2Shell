<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Upload2Shell lab matrix</title>
  <desc id="desc">Debian 13, Ubuntu 24.04 and Ubuntu 22.04 all execute the command as uid=7(lp).</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090c"/>
      <stop offset="1" stop-color="#08131a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7f95a8" letter-spacing="3">REAL LAB MATRIX / ANONYMOUS IPP / 9 OF 9</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="40" y="80" fill="#7f95a8">TARGET</text>
    <text x="300" y="80" fill="#7f95a8">GHOSTSCRIPT</text>
    <text x="560" y="80" fill="#7f95a8">CHAIN</text>
    <text x="900" y="80" fill="#7f95a8">RESULT</text>
    <line x1="40" y1="94" x2="1160" y2="94" stroke="#1d2f39"/>

    <text x="40" y="132" fill="#e9f2f5">Debian 13</text>
    <text x="300" y="132" fill="#b9cbd6">10.05.1~dfsg-1+deb13u1</text>
    <text x="560" y="132" fill="#a7f3e4">pdevice → psi_device_ref</text>
    <text x="900" y="132" fill="#a7f3e4">3/3 uid=7(lp)</text>

    <text x="40" y="180" fill="#e9f2f5">Ubuntu 24.04</text>
    <text x="300" y="180" fill="#b9cbd6">10.02.1~dfsg1-0ubuntu7.9</text>
    <text x="560" y="180" fill="#a7f3e4">pdevice → psi_device_ref</text>
    <text x="900" y="180" fill="#a7f3e4">3/3 uid=7(lp)</text>

    <text x="40" y="228" fill="#e9f2f5">Ubuntu 22.04</text>
    <text x="300" y="228" fill="#b9cbd6">9.55.0~dfsg1-0ubuntu5.14</text>
    <text x="560" y="228" fill="#f7d89a">pdevice is gx_device*</text>
    <text x="900" y="228" fill="#a7f3e4">3/3 uid=7(lp)</text>

    <line x1="40" y1="256" x2="1160" y2="256" stroke="#1d2f39"/>
    <text x="40" y="288" fill="#7f95a8">control</text>
    <text x="300" y="288" fill="#b9cbd6">+deb13u3 / 7.10 / 5.15</text>
    <text x="560" y="288" fill="#fda4af">dangling lookup fails</text>
    <text x="900" y="288" fill="#fda4af">no output</text>
  </g>

  <text x="40" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7f95a8">same request · same payload · three builds · one auto-detect</text>
</svg>
