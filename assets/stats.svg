<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
<title id="title">Upload2Shell project facts</title>
<desc id="desc">CVE-2026-125396, CVSS 8.5 high, nine of nine lab jobs, three Linux distributions, seventeen unit tests, and fixed in Ghostscript 10.08.0.</desc>
