 <linearGradient id="cyan" x2="1"><stop stop-color="#c6fff3"/><stop offset="1" stop-color="#20d9c3"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#183039" opacity=".4"/></pattern>
</defs>
<rect width="1200" height="190" rx="14" fill="url(#bg)"/><rect width="1200" height="190" rx="14" fill="url(#grid)"/>
