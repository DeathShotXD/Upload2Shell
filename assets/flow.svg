<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Upload2Shell chain</title>
  <desc id="desc">Anonymous IPP job, CUPS filter chain, Ghostscript UAF, path control bypass, command execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05090c"/>
      <stop offset="0.5" stop-color="#08131a"/>
      <stop offset="1" stop-color="#05090c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <text x="40" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7f95a8" letter-spacing="3">ATTACK FLOW / NO CREDENTIALS, NO INTERACTION</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <rect x="40" y="78" width="238" height="132" rx="14" fill="#080f13" stroke="#1d2f39"/>
      <text x="60" y="108" font-size="11" fill="#7f95a8">01 / DELIVER</text>
      <text x="60" y="140" font-size="16" fill="#e9f2f5">IPP Print-Job</text>
      <text x="60" y="166" font-size="11" fill="#a7f3e4">POST /printers/u2s</text>
      <text x="60" y="186" font-size="11" fill="#7f95a8">anonymous</text>
    </g>
    <g>
      <rect x="318" y="78" width="238" height="132" rx="14" fill="#080f13" stroke="#f5c76a" stroke-opacity="0.7"/>
      <text x="338" y="108" font-size="11" fill="#f7d89a">02 / FILTER</text>
      <text x="338" y="140" font-size="16" fill="#e9f2f5">gstopdf</text>
      <text x="338" y="166" font-size="11" fill="#f7d89a">→ gstoraster</text>
      <text x="338" y="186" font-size="11" fill="#7f95a8">gs -dSAFER</text>
    </g>
    <g>
      <rect x="596" y="78" width="238" height="132" rx="14" fill="#080f13" stroke="#fb7185" stroke-opacity="0.7"/>
      <text x="616" y="108" font-size="11" fill="#fda4af">03 / CORRUPT</text>
      <text x="616" y="140" font-size="16" fill="#e9f2f5">Type 1 UAF</text>
      <text x="616" y="166" font-size="11" fill="#fda4af">dangling ref</text>
      <text x="616" y="186" font-size="11" fill="#7f95a8">path_control_active = 0</text>
    </g>
    <g>
      <rect x="874" y="78" width="286" height="132" rx="14" fill="#07171b" stroke="#5eead4" stroke-opacity="0.75"/>
      <text x="894" y="108" font-size="11" fill="#a7f3e4">04 / EXECUTE</text>
      <text x="894" y="140" font-size="16" fill="#e9f2f5">%pipe%id</text>
      <text x="894" y="166" font-size="11" fill="#a7f3e4">uid=7(lp)</text>
      <text x="894" y="186" font-size="11" fill="#7f95a8">command as the filter user</text>
    </g>
  </g>

  <g stroke="#5eead4" stroke-width="2" fill="none">
    <path d="M 282 144 L 306 144"/>
    <path d="M 560 144 L 584 144"/>
    <path d="M 838 144 L 862 144"/>
  </g>
  <g fill="#5eead4">
    <path d="M 304 137 L 316 144 L 304 151 z"/>
    <path d="M 582 137 L 594 144 L 582 151 z"/>
    <path d="M 860 137 L 872 144 L 860 151 z"/>
  </g>

  <line x1="40" y1="248" x2="1160" y2="248" stroke="#1d2f39"/>
  <text x="40" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a7f3e4">Deployed app: 26.8.3 / 10.02.1 / 9.55.0 → vulnerable</text>
  <text x="470" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7f95a8">·</text>
  <text x="494" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a7f3e4">Fixed: 10.08.0 / +deb13u2 / 5.15 → dangling lookup fails</text>
</svg>
