<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-labelledby="u2s-t u2s-d">
  <title id="u2s-t">Upload2Shell chain</title>
  <desc id="u2s-d">Anonymous IPP job, CUPS filter chain, Ghostscript Type 1 UAF, path-control bypass, command execution as lp.</desc>
  <defs>
    <linearGradient id="f-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03070B"/>
      <stop offset="0.5" stop-color="#06121A"/>
      <stop offset="1" stop-color="#03070B"/>
    </linearGradient>
    <pattern id="f-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#0E2229" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" fill="url(#f-ink)"/>
  <rect width="1200" height="340" fill="url(#f-grid)" opacity="0.4"/>

  <text x="40" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7C93A0" letter-spacing="3">ATTACK FLOW / NO CREDENTIALS - NO INTERACTION</text>
  <rect x="40" y="48" width="1120" height="2" fill="#149E8E" opacity="0.35"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <!-- 01 -->
    <g transform="translate(40,80)">
      <rect width="238" height="150" rx="8" fill="#071319" stroke="#1E3A42"/>
      <rect x="0" y="0" width="238" height="4" fill="#2EE6D2"/>
      <text x="20" y="32" font-size="11" fill="#7C93A0">01 / DELIVER</text>
      <text x="20" y="68" font-size="17" fill="#F3E6C8">IPP Print-Job</text>
      <text x="20" y="96" font-size="11" fill="#9BF4E8">POST /printers/u2s</text>
      <text x="20" y="116" font-size="11" fill="#7C93A0">Content-Type: application/ipp</text>
      <text x="20" y="136" font-size="11" fill="#7EE787">anonymous</text>
    </g>
    <!-- 02 -->
    <g transform="translate(318,80)">
      <rect width="238" height="150" rx="8" fill="#071319" stroke="#F5871F" stroke-opacity="0.75"/>
      <rect x="0" y="0" width="238" height="4" fill="#F5871F"/>
      <text x="20" y="32" font-size="11" fill="#F8C24A">02 / FILTER</text>
      <text x="20" y="68" font-size="17" fill="#F3E6C8">gstopdf</text>
      <text x="20" y="96" font-size="11" fill="#F8C24A">-&gt; gstoraster</text>
      <text x="20" y="116" font-size="11" fill="#7C93A0">libcupsfilters 2.0</text>
      <text x="20" y="136" font-size="11" fill="#7C93A0">gs -dSAFER</text>
    </g>
    <!-- 03 -->
    <g transform="translate(596,80)">
      <rect width="238" height="150" rx="8" fill="#071319" stroke="#F26D7E" stroke-opacity="0.75"/>
      <rect x="0" y="0" width="238" height="4" fill="#F26D7E"/>
      <text x="20" y="32" font-size="11" fill="#F5A2AE">03 / CORRUPT</text>
      <text x="20" y="68" font-size="17" fill="#F3E6C8">Type 1 UAF</text>
      <text x="20" y="96" font-size="11" fill="#F5A2AE">dangling ref</text>
      <text x="20" y="116" font-size="11" fill="#7C93A0">forged string view</text>
      <text x="20" y="136" font-size="11" fill="#7EE787">path_control_active = 0</text>
    </g>
    <!-- 04 -->
    <g transform="translate(874,80)">
      <rect width="286" height="150" rx="8" fill="#08140C" stroke="#7EE787" stroke-opacity="0.8"/>
      <rect x="0" y="0" width="286" height="4" fill="#7EE787"/>
      <text x="20" y="32" font-size="11" fill="#A7F0B0">04 / EXECUTE</text>
      <text x="20" y="68" font-size="17" fill="#F3E6C8">%pipe%id</text>
      <text x="20" y="96" font-size="11" fill="#A7F0B0">uid=7(lp)</text>
      <text x="20" y="116" font-size="11" fill="#7C93A0">command as the filter user</text>
      <rect x="20" y="124" width="9" height="11" fill="#7EE787"/>
    </g>
  </g>

  <g stroke="#2EE6D2" stroke-width="2" fill="none">
    <path d="M 282 155 L 306 155"/>
    <path d="M 560 155 L 584 155"/>
    <path d="M 838 155 L 862 155"/>
  </g>
  <g fill="#2EE6D2">
    <path d="M 302 148 L 316 155 L 302 162 z"/>
    <path d="M 580 148 L 594 155 L 580 162 z"/>
    <path d="M 858 148 L 872 155 L 858 162 z"/>
  </g>

  <line x1="40" y1="270" x2="1160" y2="270" stroke="#1E3A42"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="40" y="300" fill="#A7F0B0">deployed: 26.8.3 / 10.02.1 / 9.55.0 -&gt; vulnerable</text>
    <text x="470" y="300" fill="#7C93A0">-</text>
    <text x="494" y="300" fill="#F5A2AE">fixed: 10.08.0 / +deb13u2 / 5.15 -&gt; dangling lookup fails</text>
  </g>
</svg>
