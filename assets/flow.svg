<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Upload2Shell attack path</title>
<desc id="desc">An anonymous IPP print job enters a CUPS queue, passes through Ghostscript filters, triggers a Type 1 font loader use-after-free and path-control bypass, then executes as the lp filter account.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#07131c"/><stop offset="1" stop-color="#03080e"/></linearGradient>
 <linearGradient id="amber" x2="0" y2="1"><stop stop-color="#ffe8a6"/><stop offset=".45" stop-color="#ff9c24"/><stop offset="1" stop-color="#c94c0b"/></linearGradient>
 <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#c9fff5"/><stop offset="1" stop-color="#19d9c2"/></linearGradient>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fff2d4"/><stop offset="1" stop-color="#d9c39a"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#17313a" stroke-width="1" opacity=".48"/></pattern>
 <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#20d9c5" opacity=".2"/></pattern>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="18" fill="url(#bg)"/>
<rect width="1200" height="420" rx="18" fill="url(#grid)"/>
<path d="M0 330H1200" stroke="#19323a"/>
<path d="M0 0H1200V8H0Z" fill="#ff9226"/>
<g font-family="DejaVu Sans Mono,monospace">
 <text x="44" y="55" fill="#ffe6b0" font-size="27" font-weight="bold" letter-spacing="3">THE PRINT PATH</text>
 <text x="45" y="82" fill="#6f929b" font-size="13" letter-spacing="2">ANONYMOUS IPP / CUPS FILTERS / GHOSTSCRIPT</text>
 <g transform="translate(950 31)">
  <rect width="204" height="43" rx="6" fill="#071b20" stroke="#16cbb8"/>
  <circle cx="17" cy="21" r="4" fill="#23e0c7"/>
  <text x="31" y="27" fill="#8ef9e8" font-size="15">LAB REPRODUCTION</text>
 </g>
 <!-- path rail -->
 <path d="M155 197H1042" stroke="#24434a" stroke-width="5" stroke-dasharray="5 9"/>
 <path d="M155 197H1042" stroke="#19d9c2" stroke-width="1.5" opacity=".65"/>
 <!-- step 1: paper -->
 <g transform="translate(55 120)">
  <rect x="0" y="0" width="206" height="174" rx="10" fill="#0a1b23" stroke="#1a7370"/>
  <path d="M18 17H188" stroke="#1edbc5" stroke-width="3"/>
  <g transform="translate(68 32)">
   <path d="M0 0H68L83 15V68H0Z" fill="url(#paper)" stroke="#ffad42" stroke-width="2"/>
   <path d="M68 0V15H83" fill="none" stroke="#b76a24" stroke-width="2"/>
   <path d="M12 24H64M12 34H70M12 44H59M12 54H67" stroke="#6a6659" stroke-width="3"/>
   <path d="M-9 74H92" stroke="#20d9c5" stroke-width="3"/>
  </g>
  <text x="18" y="130" fill="#fff0cf" font-size="18" font-weight="bold">IPP Print-Job</text>
  <text x="18" y="153" fill="#70e8d8" font-size="12">anonymous / no credentials</text>
  <circle cx="103" cy="77" r="6" fill="#20d9c5" filter="url(#soft)"/>
 </g>
 <!-- step 2: printer / cups -->
 <g transform="translate(340 120)">
  <rect width="206" height="174" rx="10" fill="#111b20" stroke="#9b5c21"/>
  <path d="M18 17H188" stroke="#f58a20" stroke-width="3"/>
  <g transform="translate(48 38)">
   <path d="M20 0H91V28H20Z" fill="url(#paper)" stroke="#ffad42" stroke-width="2"/>
   <path d="M8 24H102Q112 24 112 36V75H0V36Q0 24 8 24Z" fill="#29343b" stroke="#f18a26" stroke-width="3"/>
   <path d="M18 43H94V64H18Z" fill="#07121a" stroke="#53636a"/>
   <path d="M27 49H85" stroke="#20d9c5" stroke-width="3"/>
   <circle cx="91" cy="34" r="4" fill="#ff9b25"/>
   <path d="M20 75H91V88H20Z" fill="#17242b" stroke="#69747a"/>
  </g>
  <text x="18" y="130" fill="#fff0cf" font-size="18" font-weight="bold">CUPS filters</text>
  <text x="18" y="153" fill="#f4b65b" font-size="12">gstopdf -> gstoraster</text>
 </g>
 <!-- step 3: ghostscript core -->
 <g transform="translate(625 120)">
  <rect width="206" height="174" rx="10" fill="#15171c" stroke="#a54b43"/>
  <path d="M18 17H188" stroke="#ef766e" stroke-width="3"/>
  <g transform="translate(72 32)">
   <circle cx="31" cy="37" r="34" fill="#0a2529" stroke="#18d5c0" stroke-width="3"/>
   <circle cx="31" cy="37" r="23" fill="none" stroke="#e9872b" stroke-width="3" stroke-dasharray="5 4"/>
   <path d="M15 21L28 34L18 45L32 55L46 40L35 29L47 17" fill="none" stroke="#fff0cf" stroke-width="4" stroke-linecap="square"/>
   <path d="M50 5L61 -5M57 20L71 17M57 53L69 62" stroke="#ff9226" stroke-width="3"/>
  </g>
  <text x="18" y="130" fill="#fff0cf" font-size="18" font-weight="bold">Ghostscript UAF</text>
  <text x="18" y="153" fill="#f39a92" font-size="11">Type 1 UAF / -dSAFER bypass</text>
 </g>
 <!-- step 4: terminal -->
 <g transform="translate(910 120)">
  <rect width="235" height="174" rx="10" fill="#0b1c18" stroke="#4c9d5c"/>
  <path d="M18 17H217" stroke="#8fe78f" stroke-width="3"/>
  <g transform="translate(47 42)">
   <rect width="141" height="62" rx="5" fill="#030a0d" stroke="#20d9c5" stroke-width="2"/>
   <path d="M14 21L25 31L14 41M34 42H65" fill="none" stroke="#8df2b7" stroke-width="4" stroke-linecap="square"/>
   <rect x="73" y="36" width="7" height="10" fill="#ffe7ae"/>
   <circle cx="127" cy="12" r="3" fill="#f68c25"/>
  </g>
  <text x="18" y="130" fill="#fff0cf" font-size="18" font-weight="bold">Command execution</text>
  <text x="18" y="153" fill="#8fe7a0" font-size="13">uid=7(lp)</text>
 </g>
 <!-- connectors -->
 <g fill="#ff9a27">
  <path d="M270 188H324L324 180L339 197L324 214V206H270Z"/>
  <path d="M555 188H609L609 180L624 197L609 214V206H555Z"/>
 </g>
 <path d="M840 197H894L894 189L909 197L894 205V197" fill="#19d9c2"/>
 <g fill="#07131c" stroke="#f8a13b" stroke-width="2">
  <circle cx="270" cy="197" r="7"/><circle cx="555" cy="197" r="7"/><circle cx="840" cy="197" r="7"/>
 </g>
 <text x="55" y="365" fill="#7f9ca2" font-size="13" letter-spacing="1.2">THE SECURITY BOUNDARY BREAKS INSIDE THE INTERPRETER</text>
 <text x="55" y="393" fill="#f3c879" font-size="14">path_control_active -> 0</text>
 <text x="1145" y="393" fill="#1edbc5" font-size="14" text-anchor="end">CVE-2026-125396</text>
</g>
<rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#25414a"/>
</svg>